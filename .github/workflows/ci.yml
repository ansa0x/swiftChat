name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database, never the real Atlas cluster.
      MONGO_URI: mongodb://localhost:27017/swiftchat_ci
      JWT_SECRET: ci-only-not-a-real-secret-2f8c1d
      NODE_ENV: test
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run integration tests
        working-directory: backend
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -uo pipefail

          # The suites drive a real HTTP + Socket.IO server, so one has to be
          # running. Each suite gets a *fresh* server on purpose: registration
          # is rate limited to 5 per hour per IP and the counter lives in
          # process memory, so sharing one server across all suites (9
          # registrations in total) would start returning 429 partway through.
          run_suite () {
            suite="$1"
            log="/tmp/server-${suite//:/-}.log"

            echo "::group::$suite"
            npm start > "$log" 2>&1 &
            server_pid=$!

            ready=""
            for _ in $(seq 1 60); do
              if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
                ready=1
                break
              fi
              # Stop waiting if the server died rather than burning the timeout.
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [ -z "$ready" ]; then
              echo "Backend did not become healthy for $suite"
              cat "$log"
              kill "$server_pid" 2>/dev/null || true
              echo "::endgroup::"
              return 1
            fi

            status=0
            npm run "$suite" || status=$?

            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true

            if [ "$status" -ne 0 ]; then
              echo "--- backend log for $suite ---"
              cat "$log"
            fi

            echo "::endgroup::"
            return "$status"
          }

          suites="test:sockets test:groups test:notifications"

          # test:upload talks to the real Cloudinary API, so it only runs when
          # the repository has those secrets configured.
          if [ -n "${CLOUDINARY_CLOUD_NAME:-}" ] \
            && [ -n "${CLOUDINARY_API_KEY:-}" ] \
            && [ -n "${CLOUDINARY_API_SECRET:-}" ]; then
            echo "Cloudinary secrets found - including test:upload."
            suites="$suites test:upload"
          else
            echo "Skipping test:upload - Cloudinary secrets are not configured."
            echo "Add CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET"
            echo "as repository secrets to enable it."
          fi

          # Every suite runs even if an earlier one fails, so a single run
          # reports every problem rather than just the first.
          failed=""
          for suite in $suites; do
            if run_suite "$suite"; then
              echo "PASS  $suite"
              echo "- PASS \`$suite\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL  $suite"
              echo "- FAIL \`$suite\`" >> "$GITHUB_STEP_SUMMARY"
              failed="yes"
            fi
          done

          if [ -n "$failed" ]; then
            echo "One or more suites failed."
            exit 1
          fi

          echo "All suites passed."

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Placeholder only. Vite inlines VITE_* at build time, so this proves
          # the build compiles; the deployed value is set in the host.
          VITE_API_URL: http://localhost:5000
        run: npm run build
